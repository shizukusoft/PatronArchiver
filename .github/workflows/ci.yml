name: CI

on:
  push:
    branches: [main, develop, 'release/*', 'hotfix/*', 'support/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  pull_request:
    branches: [main, develop, 'release/*', 'hotfix/*', 'support/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    strategy:
      matrix:
        include:
          - platform: macOS
            build-destination: 'generic/platform=macOS'
          - platform: iOS
            build-destination: 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v5

      # Xcode 27 (Swift 6.4) is the project's floor. GitHub's macos-26 image
      # tops out at 26.6, so only the xcode-27 preview image carries it. It is
      # that image's sole Xcode, so the bare "27.0" resolves to it whether the
      # image ships a beta, RC or GA build.
      - name: Select Xcode 27
        run: sudo xcodes select 27.0

      - name: Restore Xcode Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: xcode-27-cache-${{ runner.os }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            xcode-27-cache-${{ runner.os }}-${{ matrix.platform }}-

      - name: Analyze & Build for Testing
        run: >
          xcodebuild analyze build-for-testing
          -project PatronArchiver.xcodeproj
          -scheme PatronArchiver
          -destination '${{ matrix.build-destination }}'
          -testProductsPath '${{ runner.temp }}/PatronArchiver.xctestproducts'
          CODE_SIGNING_ALLOWED=NO

      - name: Archive Test Products
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          '${{ runner.temp }}/PatronArchiver.xctestproducts'
          '${{ runner.temp }}/PatronArchiver.xctestproducts.zip'

      - name: Upload Test Products
        uses: actions/upload-artifact@v7
        with:
          name: PatronArchiver-${{ matrix.platform }}.xctestproducts
          path: ${{ runner.temp }}/PatronArchiver.xctestproducts.zip

  test:
    name: Test (${{ matrix.destination-name }})
    needs: build
    runs-on: ${{ matrix.runs-on || 'xcode-27' }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — native, no simulator
          - platform: macOS
            destination-name: macOS 27 - Mac
            test-destination: 'platform=macOS'
            runs-on: xcode-27
          # macos-26 has no Xcode 27, so its entry runs the 27-built products
          # on the newest Xcode it carries.
          - platform: macOS
            destination-name: macOS 26 - Mac
            test-destination: 'platform=macOS'
            runs-on: macos-26
            xcode-version: '26.6'
            continue-on-error: true
          - platform: macOS
            destination-name: macOS 15 - Mac
            test-destination: 'platform=macOS'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          # iOS 27 and 26 run on xcode-27 so build and test share the same
          # Xcode toolchain. The image ships only the iOS 27.0 runtime, so
          # the iOS 26 entries install theirs on demand.
          - platform: iOS
            destination-name: iOS 27 - iPhone 17 Pro Max
            device-name: iPhone 17 Pro Max
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPhone 17
            device-name: iPhone 17
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPhone Air
            device-name: iPhone Air
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPad Pro 13-inch (M5)
            device-name: iPad Pro 13-inch (M5)
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPad Air 11-inch (M4)
            device-name: iPad Air 11-inch (M4)
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPad (A16)
            device-name: iPad (A16)
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 27 - iPad mini (A17 Pro)
            device-name: iPad mini (A17 Pro)
            os-version: '27.0'
            runs-on: xcode-27
          - platform: iOS
            destination-name: iOS 26 - iPhone 17 Pro Max
            device-name: iPhone 17 Pro Max
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPhone 17
            device-name: iPhone 17
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPhone Air
            device-name: iPhone Air
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPad Pro 13-inch (M5)
            device-name: iPad Pro 13-inch (M5)
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPad Air 11-inch (M3)
            device-name: iPad Air 11-inch (M3)
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPad (A16)
            device-name: iPad (A16)
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 26 - iPad mini (A17 Pro)
            device-name: iPad mini (A17 Pro)
            os-version: '26.2'
            runs-on: xcode-27
            install-runtime: true
          - platform: iOS
            destination-name: iOS 18 - iPhone 16 Pro Max
            device-name: iPhone 16 Pro Max
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPhone 16
            device-name: iPhone 16
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPhone 16e
            device-name: iPhone 16e
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPad Pro 13-inch (M4)
            device-name: iPad Pro 13-inch (M4)
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPad Air 11-inch (M2)
            device-name: iPad Air 11-inch (M2)
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPad (10th generation)
            device-name: iPad (10th generation)
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
          - platform: iOS
            destination-name: iOS 18 - iPad mini (A17 Pro)
            device-name: iPad mini (A17 Pro)
            os-version: '18.6'
            runs-on: macos-15
            xcode-version: '26.3'
            continue-on-error: true
    steps:
      # macos-15 tops out at Xcode 26.3 and macos-26 at 26.6, so their legacy
      # entries run the Xcode 27-built products on an older toolchain — the
      # cross-Xcode swift-testing split is back for those. They stay
      # continue-on-error; macos-15 + iOS 18.6 already SIGSEGVs even with a
      # matched toolchain.
      - name: Select Xcode
        run: sudo xcodes select ${{ matrix.xcode-version || '27.0' }}

      - name: Download Test Products
        uses: actions/download-artifact@v7
        with:
          name: PatronArchiver-${{ matrix.platform }}.xctestproducts
          path: ${{ runner.temp }}

      - name: Extract Test Products
        run: ditto -x -k '${{ runner.temp }}/PatronArchiver.xctestproducts.zip' '${{ runner.temp }}'

      - name: Set screen resolution
        if: matrix.platform == 'macOS'
        run: |
          # Download displaymode v1.4.0
          curl -fsSL https://github.com/p00ya/displaymode/releases/download/v1.4.0/displaymode -o /tmp/displaymode
          chmod +x /tmp/displaymode

          # List available display modes for diagnostics
          /tmp/displaymode d || true

          # Set resolution via displaymode (CoreGraphics API)
          if /tmp/displaymode t 1920 1080; then
            echo "Resolution set via displaymode"
          else
            echo "::warning::Failed to set resolution"
          fi

          sleep 2
          /tmp/displaymode d || true

      # -buildVersion takes an OS version. A freshly installed runtime may come
      # without the device the destination names, so create it if missing.
      - name: Install iOS ${{ matrix.os-version }} Simulator Runtime
        if: matrix.install-runtime
        env:
          DEVICE_NAME: ${{ matrix.device-name }}
          OS_VERSION: ${{ matrix.os-version }}
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion "$OS_VERSION"
          RUNTIME_ID=$(xcrun simctl list runtimes --json \
            | jq -r --arg v "$OS_VERSION" '.runtimes[] | select(.platform == "iOS" and .version == $v) | .identifier' \
            | head -n 1)
          if [ -z "$RUNTIME_ID" ]; then
            echo "::error::iOS $OS_VERSION runtime not found after download"
            xcrun simctl list runtimes
            exit 1
          fi
          if ! xcrun simctl list devices --json \
            | jq -e --arg r "$RUNTIME_ID" --arg n "$DEVICE_NAME" '.devices[$r] // [] | any(.name == $n)' > /dev/null; then
            xcrun simctl create "$DEVICE_NAME" "$DEVICE_NAME" "$RUNTIME_ID"
          fi

      - name: Test
        env:
          TEST_DESTINATION: ${{ matrix.test-destination || format('platform=iOS Simulator,name={0},OS={1}', matrix.device-name, matrix.os-version) }}
        run: >
          xcodebuild test-without-building
          -testProductsPath '${{ runner.temp }}/PatronArchiver.xctestproducts'
          -destination "$TEST_DESTINATION"
          -resultBundlePath '${{ runner.temp }}/PatronArchiver.xcresult'

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PatronArchiver-${{ matrix.destination-name }}.xcresult
          path: ${{ runner.temp }}/PatronArchiver.xcresult
